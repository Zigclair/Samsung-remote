name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
      - name: Report build failure
        if: failure() && steps.compile.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Automated Android APK build failure.'
            echo ''
            echo 'Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            echo ''
            echo '~~~'
            grep -E -A 12 '(^e: |^\* What went wrong:|^> |^FAILURE:|error:|Execution failed)' build.log | tail -c 16000 || true
            echo '~~~'
          } > failure.md
          gh issue create --title "APK build failure #${{ github.run_number }}" --body-file failure.md
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FrameRemote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Report successful APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
          gh issue create --title "APK ready #${{ github.run_number }}" --body "Android debug APK compiled and uploaded successfully. Download the **FrameRemote-debug-apk** artifact from https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} . SHA256: $(cat apk-sha256.txt)"
